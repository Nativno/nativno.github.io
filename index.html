<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom V3</title>
    <style>
        :root {
            --bg-color: #0f1011;
            --card-bg: #1a1b1e;
            --card-border: #26282c;
            --accent-color: #0073ff;
            --accent-glow: rgba(0, 115, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #848995;
            --key-white: #e3e4e8;
            --key-black: #2d2f35;
            --key-black-active: #1e1f22;
            --btn-width: clamp(200px, 55vw, 280px);
            --btn-height: clamp(75px, 12vh, 90px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            padding: 15px 15px 10vh 15px;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 820px;
            justify-content: space-between;
        }

        .display-section {
            padding: 10px 20px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .main-note {
            font-size: clamp(2.75rem, 12vh, 5.5rem);
            font-weight: 800;
            color: #ffffff; 
            letter-spacing: -2px;
            line-height: 1.1;
            transition: font-size 0.2s ease;
        }

        .octave-number {
            font-size: inherit; 
            color: #ffffff;
        }

        .note-name {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 12px; 
            letter-spacing: 0.5px;
        }

        .compass-window {
            width: 100%;
            max-width: 320px;
            height: 40px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 25%, #000 75%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 25%, #000 75%, transparent 100%);
        }

        .compass-track {
            display: flex;
            align-items: center;
            height: 100%;
            width: max-content;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .compass-item {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            width: 60px; 
            text-align: center;
            opacity: 0.3;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            display: flex;
            justify-content: center;
            align-items: baseline;
            flex-shrink: 0;
        }

        .compass-item.active {
            font-size: 1.6rem;
            color: var(--accent-color);
            opacity: 1;
            font-weight: 800;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .compass-item-octave {
            font-size: 0.6em;
            opacity: 0.8;
            margin-left: 1px;
            font-weight: 500;
        }

        .info-grid {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 0 10px;
        }

        .info-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .divider {
            width: 1px;
            height: 35px;
            background-color: var(--card-border);
            margin: 0 15px;
        }

        .mic-section {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            position: relative;
        }

        .waveform-container {
            position: absolute;
            width: var(--btn-width);
            height: var(--btn-height);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            width: var(--btn-width);
            height: var(--btn-height);
            border-radius: 25px;
            border: 2px solid var(--accent-color);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .waveform-container.active .wave {
            animation: pulseWave 2.4s infinite linear;
        }

        .waveform-container.active .wave:nth-child(1) { animation-delay: 0.0s; }
        .waveform-container.active .wave:nth-child(2) { animation-delay: 0.8s; }
        .waveform-container.active .wave:nth-child(3) { animation-delay: 1.6s; }

        @keyframes pulseWave {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scaleX(1.3) scaleY(1.8); opacity: 0; }
        }

        .rect-mic-btn {
            width: var(--btn-width);
            height: var(--btn-height);
            border-radius: 25px;
            background: linear-gradient(145deg, #1c1d22, #141517);
            border: 3px solid var(--card-border);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px 20px;
            line-height: 1.3;
            box-shadow: 10px 10px 25px #070809, -10px -10px 25px #212429;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }

        .rect-mic-btn:active {
            transform: scale(0.96);
            box-shadow: inset 5px 5px 15px #070809, inset -5px -5px 15px #212429;
        }

        .rect-mic-btn.listening {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 115, 255, 0.15), 10px 10px 25px #070809;
        }

        .keyboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 18px 15px 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .octave-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .arrow-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2c2e35;
            color: var(--text-main);
            width: 46px;
            height: 38px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arrow-btn:active { background: #2c2e35; }
        .arrow-btn:disabled { opacity: 0.1; cursor: not-allowed; }

        .current-octave { display: flex; flex-direction: column; align-items: center; }
        .octave-val { font-size: 1.3rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        
        .octave-stepper { display: flex; gap: 4px; margin-top: 8px; }
        .step { width: 10px; height: 4px; background-color: #2c2e35; border-radius: 2px; transition: all 0.3s ease; }
        .step.active { background-color: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); width: 16px; }

        .piano-wrapper {
            position: relative;
            display: flex;
            width: 100%;
            height: 195px;
            background-color: #090a0b;
            border-radius: 8px;
            overflow: hidden;
            touch-action: none;
        }

        .key { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: pointer; text-align: center; }
        .key-name { font-weight: 600; line-height: 1; font-size: 0.65rem; }
        .key-freq { font-size: 0.48rem; font-weight: 500; opacity: 0.4; margin-top: 2px; }

        .white-key { width: 12.5%; background: var(--key-white); color: #555964; border-right: 1px solid #141517; padding-bottom: 14px; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; z-index: 1; }
        .white-key:last-child { border-right: none; }
        .white-key:active, .white-key.active { background: #c5c7cf; color: #111; }
        .white-key.side-half { width: 6.25%; background: var(--key-white); cursor: default; z-index: 1; }

        .black-key { position: absolute; width: 8.5%; height: 58%; background: var(--key-black); color: #9da3b4; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4); z-index: 2; top: 0; border: 1px solid #1a1b1f; padding-bottom: 10px; overflow: hidden; }
        .black-key:active, .black-key.active { background: var(--key-black-active); color: #fff; }

        .bk-1 { left: calc(6.25% - 4.25%); }
        .bk-2 { left: calc(6.25% + 12.5% - 4.25%); }
        .bk-3 { left: calc(6.25% + 25.0% - 4.25%); }
        .bk-4 { left: calc(6.25% + 37.5% - 4.25%); }
        .bk-5 { left: calc(6.25% + 50.0% - 4.25%); }
        .bk-6 { left: calc(6.25% + 62.5% - 4.25%); }
        .bk-7 { left: calc(6.25% + 75.0% - 4.25%); }
        .bk-8 { left: calc(6.25% + 87.5% - 4.25%); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="display-section">
            <div id="displayNote" class="main-note">--<span class="octave-number"></span></div>
            <div id="displayFullName" class="note-name">Aguardando áudio</div>
            
            <div class="compass-window" id="compassWindow">
                <div class="compass-track" id="compassTrack"></div>
            </div>
            
            <div class="info-grid">
                <div class="info-block">
                    <span class="info-label">Oitava</span>
                    <span id="displayOctaveText" class="info-value">-</span>
                </div>
                <div class="divider"></div>
                <div class="info-block">
                    <span class="info-label">Frequência</span>
                    <span id="displayFreqText" class="info-value">0.0 Hz</span>
                </div>
            </div>
        </div>

        <div class="mic-section">
            <div class="waveform-container" id="waveContainer">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
            <button class="rect-mic-btn" id="micBtn">
                <span>Iniciar detecção</span>
                <span style="font-size: 0.8rem; font-weight: 400; opacity: 0.6; margin-top: 2px;">de tom</span>
            </button>
        </div>

        <div class="keyboard-card">
            <div class="octave-controls">
                <button class="arrow-btn" id="prevBtn">&#8592;</button>
                <div class="current-octave">
                    <span class="octave-val" id="controlOctave">Oitava 3</span>
                    <div class="octave-stepper" id="stepperContainer">
                        <div class="step" data-step="0"></div>
                        <div class="step" data-step="1"></div>
                        <div class="step" data-step="2"></div>
                        <div class="step" data-step="3"></div>
                        <div class="step" data-step="4"></div>
                        <div class="step" data-step="5"></div>
                        <div class="step" data-step="6"></div>
                        <div class="step" data-step="7"></div>
                        <div class="step" data-step="8"></div>
                    </div>
                </div>
                <button class="arrow-btn" id="nextBtn">&#8594;</button>
            </div>

            <div class="piano-wrapper" id="keyboard"></div>
        </div>

    </div>

    <script>
        let audioCtx = null;
        let micStream = null;
        let scriptProcessor = null;
        let sourceNode = null;
        let isListening = false;

        const bufferSize = 4096; 

        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const noteFullNames = {
            "C": "Dó", "C#": "Dó Sustenido", "D": "Ré", "D#": "Ré Sustenido", "E": "Mi", 
            "F": "Fá", "F#": "Fá Sustenido", "G": "Sol", "G#": "Sol Sustenido", "A": "Lá", 
            "A#": "Lá Sustenido", "B": "Si"
        };
        
        const octaveNames = ["Zero", "Primeira", "Segunda", "Terceira", "Quarta", "Quinta", "Sexta", "Sétima", "Oitava"];

        const compassWindow = document.getElementById('compassWindow');
        const compassTrack = document.getElementById('compassTrack');
        const MIN_MIDI = 12; 
        const MAX_MIDI = 119; 
        let lastMidi = 48; 

        function getOctaveLabel(oct) {
            let o = parseInt(oct);
            if (o === 0) return "Oitava zero";
            return (octaveNames[o] || o) + " Oitava";
        }

        function getNoteHTMLByMidi(midi) {
            if (isNaN(midi)) return "-";
            const octave = Math.floor(midi / 12) - 1;
            const noteIndex = (midi % 12 + 12) % 12; 
            return `${noteStrings[noteIndex]}<span class="compass-item-octave">${octave}</span>`;
        }

        function initCompass() {
            compassTrack.innerHTML = '';
            for (let i = MIN_MIDI; i <= MAX_MIDI; i++) {
                const span = document.createElement('span');
                span.className = 'compass-item';
                span.id = 'compass-item-' + i;
                span.innerHTML = getNoteHTMLByMidi(i);
                compassTrack.appendChild(span);
            }
            updateCompassPosition(48);
        }

        function updateCompassPosition(midi) {
            if (midi < MIN_MIDI || midi > MAX_MIDI) return;
            lastMidi = midi;
            const windowWidth = compassWindow.offsetWidth;
            const itemWidth = 60;
            const offset = (windowWidth / 2) - ((midi - MIN_MIDI) * itemWidth) - (itemWidth / 2);
            compassTrack.style.transform = `translateX(${offset}px)`;
        }

        function updateCompass(midi) {
            if (midi < MIN_MIDI || midi > MAX_MIDI) return;
            document.querySelectorAll('.compass-item.active').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById('compass-item-' + midi);
            if (activeEl) activeEl.classList.add('active');
            updateCompassPosition(midi);
        }

        function resetCompass() {
            document.querySelectorAll('.compass-item.active').forEach(el => el.classList.remove('active'));
        }

        window.addEventListener('resize', () => {
            updateCompassPosition(lastMidi);
        });

        const whiteNotes = [
            { name: 'C', fullName: 'Dó', baseFreq: 65.41 }, { name: 'D', fullName: 'Ré', baseFreq: 73.42 },
            { name: 'E', fullName: 'Mi', baseFreq: 82.41 }, { name: 'F', fullName: 'Fá', baseFreq: 87.31 },
            { name: 'G', fullName: 'Sol', baseFreq: 98.00 }, { name: 'A', fullName: 'Lá', baseFreq: 110.00 },
            { name: 'B', fullName: 'Si', baseFreq: 123.47 }
        ];

        const blackNotes = [
            { name: 'B#', labelOffset: -1, fullName: 'Si Sustenido', class: 'bk-1', baseFreq: 61.74 },
            { name: 'C#', labelOffset: 0, fullName: 'Dó Sustenido', class: 'bk-2', baseFreq: 69.30 },
            { name: 'D#', labelOffset: 0, fullName: 'Ré Sustenido', class: 'bk-3', baseFreq: 77.78 },
            { name: 'E#', labelOffset: 0, fullName: 'Mi Sustenido', class: 'bk-4', baseFreq: 87.31 },
            { name: 'F#', labelOffset: 0, fullName: 'Fá Sustenido', class: 'bk-5', baseFreq: 92.50 },
            { name: 'G#', labelOffset: 0, fullName: 'Sol Sustenido', class: 'bk-6', baseFreq: 103.83 },
            { name: 'A#', labelOffset: 0, fullName: 'Lá Sustenido', class: 'bk-7', baseFreq: 116.54 },
            { name: 'B#', labelOffset: 0, fullName: 'Si Sustenido', class: 'bk-8', baseFreq: 130.81 }
        ];

        let currentOctave = 3;
        const minOctave = 0;
        const maxOctave = 8;

        const keyboardDiv = document.getElementById('keyboard');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const controlOctaveDisplay = document.getElementById('controlOctave');
        const micBtn = document.getElementById('micBtn');
        const waveContainer = document.getElementById('waveContainer');
        
        const displayNote = document.getElementById('displayNote');
        const displayFullName = document.getElementById('displayFullName');
        const displayOctaveText = document.getElementById('displayOctaveText');
        const displayFreqText = document.getElementById('displayFreqText');

        function complexPitchDetect(buffer, sampleRate) {
            let size = buffer.length;
            let rms = 0;

            for (let i = 0; i < size; i++) {
                rms += buffer[i] * buffer[i];
            }
            rms = Math.sqrt(rms / size);
            if (rms < 0.02) return -1; 

            let r1 = 0, r2 = size - 1, thres = 0.15;
            for (let i = 0; i < size / 2; i++) {
                if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
            }
            for (let i = size - 1; i >= size / 2; i--) {
                if (Math.abs(buffer[i]) < thres) { r2 = i; break; }
            }
            buffer = buffer.slice(r1, r2);
            size = buffer.length;

            let correlations = new Float32Array(size);
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size - i; j++) {
                    correlations[i] += buffer[j] * buffer[j + i];
                }
            }

            let d = 0;
            while (correlations[d] > correlations[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < size; i++) {
                if (correlations[i] > maxval) {
                    maxval = correlations[i];
                    maxpos = i;
                }
            }

            let T0 = maxpos;
            if (T0 > 0 && T0 < size - 1) {
                let x1 = correlations[T0 - 1], x2 = correlations[T0], x3 = correlations[T0 + 1];
                let a = (x1 + x3 - 2 * x2) / 2;
                let b = (x3 - x1) / 2;
                if (a) T0 = T0 - b / (2 * a);
            }

            let freq = sampleRate / T0;
            return (freq > 15 && freq < 8000) ? freq : -1;
        }

        let noteVotes = {};
        let totalVotesCollected = 0;
        let collectedFreqs = [];

        function processAudioBuffer(e) {
            if (!isListening) return;
            
            const inputBuffer = e.inputBuffer.getChannelData(0);
            const frequency = complexPitchDetect(inputBuffer, audioCtx.sampleRate);

            if (frequency !== -1) {
                let roundedNote = Math.round(12 * (Math.log(frequency / 440) / Math.log(2)) + 69);
                noteVotes[roundedNote] = (noteVotes[roundedNote] || 0) + 1;
                collectedFreqs.push(frequency);
            }
            totalVotesCollected++;

            if (totalVotesCollected >= 5) {
                let winnerMidi = null;
                let maxVotes = 0;

                for (let key in noteVotes) {
                    if (noteVotes[key] > maxVotes) {
                        maxVotes = noteVotes[key];
                        winnerMidi = parseInt(key);
                    }
                }

                if (winnerMidi !== null && maxVotes >= 2) { 
                    let noteIndex = (winnerMidi % 12 + 12) % 12;
                    let octave = Math.floor(winnerMidi / 12) - 1;
                    let noteName = noteStrings[noteIndex];

                    let avgFreq = collectedFreqs.reduce((a, b) => a + b, 0) / collectedFreqs.length;

                    displayNote.innerHTML = `${noteName}<span class="octave-number">${octave}</span>`;
                    displayFullName.innerText = noteFullNames[noteName];
                    displayOctaveText.innerText = getOctaveLabel(octave);
                    displayFreqText.innerText = `${avgFreq.toFixed(1)} Hz`;
                    
                    updateCompass(winnerMidi);
                }

                noteVotes = {};
                totalVotesCollected = 0;
                collectedFreqs = [];
            }
        }

        async function toggleMic() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (isListening) {
                isListening = false;
                micBtn.classList.remove('listening');
                waveContainer.classList.remove('active');
                micBtn.innerHTML = `<span>Iniciar detecção</span><span style="font-size: 0.8rem; font-weight: 400; opacity: 0.6; margin-top: 2px;">de tom</span>`;
                
                if (scriptProcessor) {
                    scriptProcessor.onaudioprocess = null;
                    scriptProcessor.disconnect();
                }
                if (sourceNode) sourceNode.disconnect();
                if (micStream) micStream.getTracks().forEach(track => track.stop());

                displayNote.innerHTML = `--`;
                displayFullName.innerText = "Detecção encerrada";
                displayOctaveText.innerText = "-";
                displayFreqText.innerText = "0.0 Hz";
                resetCompass();
            } else {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    isListening = true;
                    micBtn.classList.add('listening');
                    waveContainer.classList.add('active');
                    
                    micBtn.innerHTML = `
                        <span>Ouvindo...</span>
                        <span style="font-size: 0.8rem; font-weight: 400; opacity: 0.8; margin-top: 2px;">Fale ou cante</span>
                        <span style="font-size: 0.65rem; font-weight: 700; color: #ffffff; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Toque para parar</span>
                    `;
                    
                    if(audioCtx.state === 'suspended') await audioCtx.resume();

                    sourceNode = audioCtx.createMediaStreamSource(micStream);
                    
                    scriptProcessor = audioCtx.createScriptProcessor(bufferSize, 1, 1);
                    scriptProcessor.onaudioprocess = processAudioBuffer;

                    sourceNode.connect(scriptProcessor);
                    scriptProcessor.connect(audioCtx.destination);

                    noteVotes = {};
                    totalVotesCollected = 0;
                    collectedFreqs = [];
                } catch (err) {
                    alert("Por favor, permita o acesso ao microfone nas configurações do seu celular.");
                    console.error(err);
                }
            }
        }

        micBtn.addEventListener('click', toggleMic);
        
        function startTone(frequency) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'triangle'; 
            oscillator.frequency.value = frequency;
            
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            
            gainNode.gain.linearRampToValueAtTime(1, now + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 4.0);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(now);
            oscillator.stop(now + 4.5);
            
            return { gainNode, startTime: now };
        }

        function stopTone(toneData, holdTimeMs) {
            if (!toneData) return;
            
            const now = audioCtx.currentTime;
            const timeSinceStart = now - toneData.startTime;

            if (holdTimeMs < 250) {
                const gain = toneData.gainNode.gain;
                
                gain.cancelScheduledValues(now);
                
                let currentGain = gain.value;
                if (currentGain < 0.001) currentGain = 0.001; 
                
                gain.setValueAtTime(currentGain, now);
                
                let timeRemaining = 3.0 - timeSinceStart;
                if (timeRemaining < 0.1) timeRemaining = 0.1;
                
                gain.exponentialRampToValueAtTime(0.001, now + timeRemaining);
            }
        }

        function getFrequency(baseFreq, octave) {
            return (baseFreq * Math.pow(2, octave - 2)).toFixed(1);
        }

        function updateStepper() {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.toggle('active', parseInt(step.getAttribute('data-step')) === currentOctave);
            });
        }

        function bindKeyEvents(keyDiv, noteName, fullName, freq, labelOctave) {
            let isPressed = false;
            let pressStartTime = 0;
            let activeTone = null;
            
            let midiNote = Math.round(12 * (Math.log(freq / 440) / Math.log(2)) + 69);

            const handleStart = (e) => {
                if (e.type === 'touchstart' || e.type === 'mousedown') {
                    if (e.type === 'touchstart') e.preventDefault();
                }
                if (isPressed) return;
                isPressed = true;
                
                pressStartTime = Date.now();
                activeTone = startTone(freq);
                keyDiv.classList.add('active');

                displayNote.innerHTML = `${noteName}<span class="octave-number">${labelOctave}</span>`;
                displayFullName.innerText = fullName;
                displayOctaveText.innerText = getOctaveLabel(labelOctave);
                displayFreqText.innerText = `${freq} Hz`;
                
                updateCompass(midiNote);
            };

            const handleEnd = (e) => {
                if (e && (e.type === 'touchend' || e.type === 'touchcancel')) {
                    e.preventDefault();
                }
                if (!isPressed) return;
                isPressed = false;
                
                keyDiv.classList.remove('active');
                
                let holdTime = Date.now() - pressStartTime;
                stopTone(activeTone, holdTime);
                activeTone = null;
            };

            keyDiv.addEventListener('mousedown', handleStart);
            keyDiv.addEventListener('touchstart', handleStart, { passive: false });
            
            keyDiv.addEventListener('mouseup', handleEnd);
            keyDiv.addEventListener('mouseleave', handleEnd); 
            keyDiv.addEventListener('touchend', handleEnd, { passive: false });
            keyDiv.addEventListener('touchcancel', handleEnd, { passive: false });
        }

        function renderKeyboard() {
            keyboardDiv.innerHTML = ''; 
            
            const leftHalf = document.createElement('div');
            leftHalf.className = 'key white-key side-half';
            keyboardDiv.appendChild(leftHalf);

            whiteNotes.forEach(note => {
                const freq = getFrequency(note.baseFreq, currentOctave);
                const keyDiv = document.createElement('div');
                keyDiv.className = 'key white-key';
                keyDiv.innerHTML = `<span class="key-name">${note.name}${currentOctave}</span><span class="key-freq">${freq}Hz</span>`;

                bindKeyEvents(keyDiv, note.name, note.fullName, freq, currentOctave);
                keyboardDiv.appendChild(keyDiv);
            });

            const rightHalf = document.createElement('div');
            rightHalf.className = 'key white-key side-half';
            keyboardDiv.appendChild(rightHalf);

            blackNotes.forEach((note) => {
                const calculatedLabelOctave = currentOctave + note.labelOffset;

                if (note.name === 'B#' && calculatedLabelOctave === -1) {
                    return;
                }

                const freq = getFrequency(note.baseFreq, currentOctave);
                const keyDiv = document.createElement('div');

                keyDiv.className = `key black-key ${note.class}`;
                keyDiv.innerHTML = `<span class="key-name">${note.name}${calculatedLabelOctave}</span><span class="key-freq">${freq}Hz</span>`;

                bindKeyEvents(keyDiv, note.name, note.fullName, freq, calculatedLabelOctave);
                keyboardDiv.appendChild(keyDiv);
            });

            controlOctaveDisplay.innerText = `Oitava ${currentOctave}`;
            updateStepper();
            
            prevBtn.disabled = currentOctave <= minOctave;
            nextBtn.disabled = currentOctave >= maxOctave;
        }

        prevBtn.addEventListener('click', () => { if (currentOctave > minOctave) { currentOctave--; renderKeyboard(); } });
        nextBtn.addEventListener('click', () => { if (currentOctave < maxOctave) { currentOctave++; renderKeyboard(); } });

        initCompass();
        renderKeyboard();
    </script>
</body>
</html>
