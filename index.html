<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Piano Minimalista</title>
    <style>
        body { 
            background-color: #0f0f0f; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            gap: 40px;
        }
        #keyboard { 
            display: flex; 
            padding: 20px; 
            background: #1a1a1a; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
        }
        .key { width: 55px; height: 160px; cursor: pointer; border-radius: 0 0 8px 8px; margin: 0 5px; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 10px; font-weight: 500; user-select: none; }
        .label { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .note-name { font-size: 13px; }
        .note-freq { font-size: 10px; opacity: 0.7; }
        .white { background: #e0e0e0; color: #555; z-index: 1; }
        .black { background: #333; color: #aaa; width: 40px; height: 100px; margin-left: -22px; margin-right: -22px; z-index: 3; border-radius: 0 0 6px 6px; }
        .playing { background-color: #007AFF !important; color: #fff !important; box-shadow: 0 0 20px #007AFF; }
        
        /* Painel de controles na vertical */
        #controls { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .toggle-wrapper { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            color: #888; 
            font-size: 14px; 
        }
        .square-toggle { 
            width: 40px; height: 40px; 
            background: #222; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.3s; border: 2px solid #333;
            color: #555; font-weight: bold;
        }
        .square-toggle.active { 
            background: #007AFF; color: #fff; border-color: #007AFF; 
        }
        .switch-input { display: none; }
    </style>
</head>
<body>

<div id="keyboard"></div>

<div id="controls">
    <div class="toggle-wrapper">
        <input type="checkbox" id="toggle-once" class="switch-input" onclick="setMode('once')">
        <label for="toggle-once" id="label-once" class="square-toggle">1x</label>
        Uma vez
    </div>
    <div class="toggle-wrapper">
        <input type="checkbox" id="toggle-infinite" class="switch-input" onclick="setMode('infinite')">
        <label for="toggle-infinite" id="label-infinite" class="square-toggle">∞</label>
        Indefinido
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let mode = 'once';
    let currentNote = null; 

    function updateToggles() {
        document.getElementById('toggle-once').checked = (mode === 'once');
        document.getElementById('toggle-infinite').checked = (mode === 'infinite');
        
        document.getElementById('label-once').classList.toggle('active', mode === 'once');
        document.getElementById('label-infinite').classList.toggle('active', mode === 'infinite');
    }

    function setMode(m) {
        stopAll();
        mode = (mode === m) ? null : m;
        if (!mode) mode = 'once';
        updateToggles();
    }

    function stopAll() {
        if (currentNote) {
            currentNote.osc.stop();
            const el = document.getElementById('key-' + currentNote.name);
            if (el) el.classList.remove('playing');
            currentNote = null;
        }
    }

    function playNote(freq, noteName) {
        if (!mode) { mode = 'once'; updateToggles(); }
        
        if (currentNote && currentNote.name === noteName) {
            stopAll();
            return;
        }

        stopAll();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();

        currentNote = { osc, gain, name: noteName };
        document.getElementById('key-' + noteName).classList.add('playing');

        if (mode === 'once') {
            setTimeout(() => {
                if (currentNote && currentNote.name === noteName) stopAll();
            }, 1000);
        }
    }

    const notes = [
        { note: 'C2', freq: 65.41, type: 'white' }, { note: 'C#2', freq: 69.30, type: 'black' },
        { note: 'D2', freq: 73.42, type: 'white' }, { note: 'D#2', freq: 77.78, type: 'black' },
        { note: 'E2', freq: 82.41, type: 'white' }, { note: 'F2', freq: 87.31, type: 'white' },
        { note: 'F#2', freq: 92.50, type: 'black' }, { note: 'G2', freq: 98.00, type: 'white' },
        { note: 'G#2', freq: 103.83, type: 'black' }, { note: 'A2', freq: 110.00, type: 'white' },
        { note: 'A#2', freq: 116.54, type: 'black' }, { note: 'B2', freq: 123.47, type: 'white' },
        { note: 'C3', freq: 130.81, type: 'white' }, { note: 'C#3', freq: 138.59, type: 'black' },
        { note: 'D3', freq: 146.83, type: 'white' }, { note: 'D#3', freq: 155.56, type: 'black' },
        { note: 'E3', freq: 164.81, type: 'white' }, { note: 'F3', freq: 174.61, type: 'white' },
        { note: 'F#3', freq: 185.00, type: 'black' }, { note: 'G3', freq: 196.00, type: 'white' },
        { note: 'G#3', freq: 207.65, type: 'black' }, { note: 'A3', freq: 220.00, type: 'white' },
        { note: 'A#3', freq: 233.08, type: 'black' }, { note: 'B3', freq: 246.94, type: 'white' }
    ];

    const keyboard = document.getElementById('keyboard');
    notes.forEach(n => {
        const key = document.createElement('div');
        key.id = 'key-' + n.note;
        key.className = `key ${n.type}`;
        key.innerHTML = `<div class="label"><span class="note-name">${n.note.replace('#', '♯')}</span><span class="note-freq">${n.freq}</span></div>`;
        key.onmousedown = () => playNote(n.freq, n.note);
        keyboard.appendChild(key);
    });
    
    updateToggles();
</script>
</body>
</html>
