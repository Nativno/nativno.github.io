<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Tom - Premium UI Final</title>
    <style>
        :root {
            --bg-color: #0f1011;
            --card-bg: #1a1b1e;
            --card-border: #26282c;
            --accent-color: #0073ff;
            --danger-color: #ff4a4a;
            
            --text-main: #ffffff;
            --text-muted: #848995;
            
            --key-white: #e3e4e8;
            --key-black: #2d2f35;
            --key-black-active: #1e1f22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 820px;
            justify-content: space-between;
        }

        /* --- CARD SUPERIOR (DISPLAY & GRÁFICO) --- */
        .main-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-header {
            display: flex;
            justify-content: center;
        }

        .action-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 32px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 74, 74, 0.3);
            transition: opacity 0.2s;
        }
        
        .action-btn.start-mode {
            background-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(0, 115, 255, 0.3);
        }

        .action-btn:active { opacity: 0.8; }

        .chart-area {
            background-color: #090a0b;
            border: 1px solid #222429;
            border-radius: 8px;
            height: 85px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .chart-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            box-shadow: 0 0 8px var(--accent-color);
            opacity: 0.7;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #141517;
            border-radius: 12px;
            padding: 12px 10px;
            border: 1px solid #202226;
        }

        .data-block {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .data-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .data-value { font-size: 1.1rem; font-weight: 700; }

        .data-block.center-accent .data-value-box {
            background-color: white;
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 1.4rem;
            font-weight: 800;
            display: inline-block;
            margin: 0 auto;
            line-height: 1.2;
        }

        .data-block.center-accent .data-sub {
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            margin-top: 4px;
        }

        /* --- CARD INFERIOR (CONTROLES E TECLADO) --- */
        .keyboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 18px 15px 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .octave-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .arrow-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2c2e35;
            color: var(--text-main);
            width: 46px;
            height: 38px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arrow-btn:active { background: #2c2e35; }
        .arrow-btn:disabled { opacity: 0.1; cursor: not-allowed; }

        .current-octave { 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Ajuste do texto solicitado: "Oitava X" */
        .octave-val { 
            font-size: 1.3rem; 
            font-weight: 700; 
            display: block; 
            line-height: 1.2; 
            color: #fff; 
            letter-spacing: 0.5px;
        }
        
        .octave-stepper {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .step {
            width: 12px;
            height: 4px;
            background-color: #2c2e35;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .step.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
            width: 18px;
        }

        /* CORPO DO PIANO (+15% de Altura: de 170px para 195px) */
        .piano-wrapper {
            position: relative;
            display: flex;
            width: 100%;
            height: 195px;
            background-color: #090a0b;
            border-radius: 8px;
            overflow: hidden;
        }

        .key {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            cursor: pointer;
            text-align: center;
        }

        .key-name { font-weight: 600; line-height: 1; font-size: 0.65rem; }
        .key-freq { font-size: 0.48rem; font-weight: 500; opacity: 0.4; margin-top: 2px; }

        /* Teclas Brancas (+15% mais altas) */
        .white-key {
            width: 12.5%;
            background: var(--key-white);
            color: #555964;
            border-right: 1px solid #141517;
            padding-bottom: 14px;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            z-index: 1;
        }
        .white-key:last-child { border-right: none; }
        .white-key:active, .white-key.active { background: #c5c7cf; color: #111; }
        
        .white-key.side-half {
            width: 6.25%;
            background: var(--key-white);
            cursor: default;
            z-index: 1;
        }

        /* Teclas Pretas (Mantêm proporção anatômica de 58% da altura do wrapper) */
        .black-key {
            position: absolute;
            width: 8.5%; 
            height: 58%;
            background: var(--key-black);
            color: #9da3b4;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            z-index: 2;
            top: 0;
            border: 1px solid #1a1b1f;
            padding-bottom: 10px;
            overflow: hidden;
        }
        .black-key:active, .black-key.active { background: var(--key-black-active); color: #fff; }

        /* Alinhamento anatômico nas frestas */
        .bk-1 { left: calc(6.25% - 4.25%); }
        .bk-2 { left: calc(6.25% + 12.5% - 4.25%); }
        .bk-3 { left: calc(6.25% + 25.0% - 4.25%); }
        .bk-4 { left: calc(6.25% + 37.5% - 4.25%); }
        .bk-5 { left: calc(6.25% + 50.0% - 4.25%); }
        .bk-6 { left: calc(6.25% + 62.5% - 4.25%); }
        .bk-7 { left: calc(6.25% + 75.0% - 4.25%); }
        .bk-8 { left: calc(6.25% + 87.5% - 4.25%); }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- CARD SUPERIOR: Gráfico e Dados de Detecção -->
        <div class="main-card">
            <div class="card-header">
                <button class="action-btn" id="actionBtn">Pausar</button>
            </div>
            
            <div class="chart-area">
                <div class="chart-line"></div>
            </div>
            
            <div class="data-row">
                <div class="data-block">
                    <span class="data-label">Nota</span>
                    <span class="data-value" id="simpleNote">--</span>
                </div>
                
                <div class="data-block center-accent">
                    <div class="data-value-box" id="accentNote">--</div>
                    <div class="data-sub" id="fullNameDisplay">Aguardando som</div>
                </div>
                
                <div class="data-block">
                    <span class="data-label">Frequência</span>
                    <span class="data-value" id="freqDisplay">0.0 Hz</span>
                </div>
            </div>
        </div>

        <!-- CARD INFERIOR: Controles Reestilizados + Teclado Mais Alto -->
        <div class="keyboard-card">
            
            <div class="octave-controls">
                <button class="arrow-btn" id="prevBtn">&#8592;</button>
                <div class="current-octave">
                    <!-- Modificado para exibir a palavra "Oitava" ao lado do número -->
                    <span class="octave-val" id="controlOctave">Oitava 2</span>
                    <div class="octave-stepper" id="stepperContainer">
                        <div class="step" data-step="2"></div>
                        <div class="step" data-step="3"></div>
                        <div class="step" data-step="4"></div>
                        <div class="step" data-step="5"></div>
                    </div>
                </div>
                <button class="arrow-btn" id="nextBtn">&#8594;</button>
            </div>

            <!-- Corpo do Piano -->
            <div class="piano-wrapper" id="keyboard">
                <!-- Gerado dinamicamente via JS -->
            </div>
        </div>

    </div>

    <script>
        let audioCtx;

        const whiteNotes = [
            { name: 'C', fullName: 'Dó', baseFreq: 65.41 },
            { name: 'D', fullName: 'Ré', baseFreq: 73.42 },
            { name: 'E', fullName: 'Mi', baseFreq: 82.41 },
            { name: 'F', fullName: 'Fá', baseFreq: 87.31 },
            { name: 'G', fullName: 'Sol', baseFreq: 98.00 },
            { name: 'A', fullName: 'Lá', baseFreq: 110.00 },
            { name: 'B', fullName: 'Si', baseFreq: 123.47 }
        ];

        const blackNotes = [
            { name: 'B#', labelOffset: -1, fullName: 'Si Sustenido', class: 'bk-1', baseFreq: 61.74 },
            { name: 'C#', labelOffset: 0, fullName: 'Dó Sustenido', class: 'bk-2', baseFreq: 69.30 },
            { name: 'D#', labelOffset: 0, fullName: 'Ré Sustenido', class: 'bk-3', baseFreq: 77.78 },
            { name: 'E#', labelOffset: 0, fullName: 'Mi Sustenido', class: 'bk-4', baseFreq: 87.31 },
            { name: 'F#', labelOffset: 0, fullName: 'Fá Sustenido', class: 'bk-5', baseFreq: 92.50 },
            { name: 'G#', labelOffset: 0, fullName: 'Sol Sustenido', class: 'bk-6', baseFreq: 103.83 },
            { name: 'A#', labelOffset: 0, fullName: 'Lá Sustenido', class: 'bk-7', baseFreq: 116.54 },
            { name: 'B#', labelOffset: 0, fullName: 'Si Sustenido', class: 'bk-8', baseFreq: 130.81 }
        ];

        let currentOctave = 2;
        const minOctave = 2;
        const maxOctave = 5;

        const keyboardDiv = document.getElementById('keyboard');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const controlOctaveDisplay = document.getElementById('controlOctave');
        
        const simpleNote = document.getElementById('simpleNote');
        const accentNote = document.getElementById('accentNote');
        const fullNameDisplay = document.getElementById('fullNameDisplay');
        const freqDisplay = document.getElementById('freqDisplay');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(frequency) {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'triangle'; 
            oscillator.frequency.value = frequency;
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 1.2);
        }

        function getFrequency(baseFreq, octave) {
            const multiplier = Math.pow(2, octave - 2);
            return (baseFreq * multiplier).toFixed(1);
        }

        function updateStepper() {
            const steps = document.querySelectorAll('.step');
            steps.forEach(step => {
                if (parseInt(step.getAttribute('data-step')) === currentOctave) {
                    step.classList.add('active');
                } else {
                    step.classList.remove('active');
                }
            });
        }

        function renderKeyboard() {
            keyboardDiv.innerHTML = ''; 
            
            // 1. Meia branca esquerda
            const leftHalf = document.createElement('div');
            leftHalf.className = 'key white-key side-half';
            keyboardDiv.appendChild(leftHalf);

            // 2. Brancas centrais
            whiteNotes.forEach(note => {
                const freq = getFrequency(note.baseFreq, currentOctave);
                const keyDiv = document.createElement('div');
                keyDiv.className = 'key white-key';
                keyDiv.innerHTML = `
                    <span class="key-name">${note.name}${currentOctave}</span>
                    <span class="key-freq">${freq}Hz</span>
                `;

                const triggerPlay = (e) => {
                    e.preventDefault();
                    playTone(freq);
                    keyDiv.classList.add('active');
                    setTimeout(() => keyDiv.classList.remove('active'), 150);

                    simpleNote.innerText = `${note.name}${currentOctave}`;
                    accentNote.innerText = `${note.name}${currentOctave}`;
                    fullNameDisplay.innerText = note.fullName;
                    freqDisplay.innerText = `${freq} Hz`;
                };

                keyDiv.addEventListener('mousedown', triggerPlay);
                keyDiv.addEventListener('touchstart', triggerPlay, { passive: false });
                keyboardDiv.appendChild(keyDiv);
            });

            // 3. Meia branca direita
            const rightHalf = document.createElement('div');
            rightHalf.className = 'key white-key side-half';
            keyboardDiv.appendChild(rightHalf);

            // 4. Pretas sobrepostas
            blackNotes.forEach((note) => {
                const freq = getFrequency(note.baseFreq, currentOctave);
                const keyDiv = document.createElement('div');
                const calculatedLabelOctave = currentOctave + note.labelOffset;

                keyDiv.className = `key black-key ${note.class}`;
                keyDiv.innerHTML = `
                    <span class="key-name">${note.name}${calculatedLabelOctave}</span>
                    <span class="key-freq">${freq}Hz</span>
                `;

                const triggerPlay = (e) => {
                    e.preventDefault();
                    playTone(freq);
                    keyDiv.classList.add('active');
                    setTimeout(() => keyDiv.classList.remove('active'), 150);

                    simpleNote.innerText = `${note.name}${calculatedLabelOctave}`;
                    accentNote.innerText = `${note.name}${calculatedLabelOctave}`;
                    fullNameDisplay.innerText = note.fullName;
                    freqDisplay.innerText = `${freq} Hz`;
                };

                keyDiv.addEventListener('mousedown', triggerPlay);
                keyDiv.addEventListener('touchstart', triggerPlay, { passive: false });
                keyboardDiv.appendChild(keyDiv);
            });

            // Atualiza o texto do indicador para "Oitava X"
            controlOctaveDisplay.innerText = `Oitava ${currentOctave}`;
            updateStepper();
            
            prevBtn.disabled = currentOctave <= minOctave;
            nextBtn.disabled = currentOctave >= maxOctave;
        }

        prevBtn.addEventListener('click', () => {
            if (currentOctave > minOctave) {
                currentOctave--;
                renderKeyboard();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentOctave < maxOctave) {
                currentOctave++;
                renderKeyboard();
            }
        });

        const actionBtn = document.getElementById('actionBtn');
        let isRunning = true;

        actionBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            initAudio();
            if (isRunning) {
                actionBtn.classList.remove('start-mode');
                actionBtn.innerText = 'Pausar';
                fullNameDisplay.innerText = 'Aguardando som';
            } else {
                actionBtn.classList.add('start-mode');
                actionBtn.innerText = 'Iniciar';
                fullNameDisplay.innerText = 'Detecção pausada';
            }
        });

        renderKeyboard();
    </script>
</body>
</html>
