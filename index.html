<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pitch Pipe</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 24px; font-weight: 500; margin-bottom: 20px; }

        /* Estilos dos botões de modo */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 10px 15px;
            border: 1px solid #4a4a5a;
            background-color: #2a2a35;
            color: #aaa;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: #64b5f6;
            color: #000;
            border-color: #64b5f6;
            font-weight: bold;
        }

        .pitch-pipe-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 40px;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #2a2a35;
            border: 2px solid #4a4a5a;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            color: #aaaaaa;
            z-index: 10;
        }

        .note-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #2a2a35;
            border: 2px solid #888;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .note-btn:hover { background-color: #3f3f4e; transform: scale(1.1); }
        .note-btn:active { background-color: #555566; }

        .btn-c { top: 0; left: 120px; }
        .btn-d { top: 35px; right: 25px; }
        .btn-e { top: 120px; right: 0; }
        .btn-f { bottom: 0; right: 45px; }
        .btn-g { bottom: 0; left: 45px; }
        .btn-a { top: 120px; left: 0; }
        .btn-b { top: 35px; left: 25px; }

        .info-panel {
            width: 100%;
            max-width: 600px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 20px 0;
            display: flex;
            justify-content: space-around;
        }

        .info-item { text-align: center; }
        .info-label { color: #64b5f6; font-size: 14px; margin-bottom: 10px; }
        .info-value { font-size: 16px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>Interactive Pitch Pipe</h1>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('one-shot', this)">One-shot</button>
        <button class="mode-btn" onclick="setMode('continuous', this)">Continuous</button>
        <button class="mode-btn" onclick="setMode('repetitive', this)">Repetitive</button>
    </div>

    <div class="pitch-pipe-container">
        <div class="center-circle" id="center-display">Select a Note</div>
        <div class="note-btn btn-c" onclick="playNote('C', 261.63)">C</div>
        <div class="note-btn btn-d" onclick="playNote('D', 293.66)">D</div>
        <div class="note-btn btn-e" onclick="playNote('E', 329.63)">E</div>
        <div class="note-btn btn-f" onclick="playNote('F', 349.23)">F</div>
        <div class="note-btn btn-g" onclick="playNote('G', 392.00)">G</div>
        <div class="note-btn btn-a" onclick="playNote('A', 440.00)">A</div>
        <div class="note-btn btn-b" onclick="playNote('B', 493.88)">B</div>
    </div>

    <div class="info-panel">
        <div class="info-item">
            <div class="info-label">Selected Note</div>
            <div class="info-value" id="note-val">None</div>
        </div>
        <div class="info-item">
            <div class="info-label">Frequency</div>
            <div class="info-value" id="freq-val">0 Hz</div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentMode = 'one-shot';
        let activeOscillator = null;
        let activeInterval = null;

        function setMode(mode, btnElement) {
            // Limpa tudo ao trocar de modo
            stopAllAudio();
            
            // Gerencia UI dos botões
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentMode = mode;
        }

        function stopAllAudio() {
            if (activeOscillator) {
                activeOscillator.stop();
                activeOscillator.disconnect();
                activeOscillator = null;
            }
            if (activeInterval) {
                clearInterval(activeInterval);
                activeInterval = null;
            }
        }

        function playNote(note, freq) {
            stopAllAudio();
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            // Atualiza UI
            document.getElementById('center-display').innerText = note;
            document.getElementById('note-val').innerText = note;
            document.getElementById('freq-val').innerText = freq + ' Hz';

            if (currentMode === 'one-shot') {
                triggerTone(freq, 1.5);
            } else if (currentMode === 'continuous') {
                triggerTone(freq, null); // null = duração infinita até novo comando
            } else if (currentMode === 'repetitive') {
                triggerTone(freq, 0.5); // Toca uma vez imediata
                activeInterval = setInterval(() => {
                    triggerTone(freq, 0.5);
                }, 1000);
            }
        }

        function triggerTone(freq, duration) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = freq;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            
            if (duration) {
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                oscillator.stop(audioCtx.currentTime + duration);
            } else {
                // Modo contínuo: armazena a referência para parar depois
                activeOscillator = oscillator;
            }
        }
    </script>
</body>
</html>
