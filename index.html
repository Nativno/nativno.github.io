<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Tom - Night Mode</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1d2d;
            --accent-color: #00e6e6;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --key-white: #e8e9f0;
            --key-black: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        /* --- TOP SECTION: DISPLAY --- */
        .display-section {
            text-align: center;
            padding: 40px 20px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .note-wrapper {
            margin-bottom: 5px;
        }

        .main-note {
            font-size: 5.5rem;
            font-weight: 800;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0, 230, 230, 0.4);
            letter-spacing: -2px;
        }

        .octave-number {
            font-size: 3rem;
            color: var(--text-main);
            vertical-align: super;
            text-shadow: none;
        }

        .note-name {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .info-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .info-block {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .divider {
            width: 1px;
            height: 40px;
            background-color: #2c314a;
            margin: 0 15px;
        }

        /* --- MIDDLE SECTION: MIC BUTTON --- */
        .mic-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-grow: 1;
        }

        .mic-button {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #161926, #1c1f30);
            box-shadow: 10px 10px 20px #090a10, -10px -10px 20px #151824;
            border: 2px solid #2c314a;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.4;
        }

        .mic-button:active {
            box-shadow: inset 10px 10px 20px #090a10, inset -10px -10px 20px #151824;
        }

        .mic-button.listening {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px rgba(0, 230, 230, 0.2);
            color: var(--accent-color);
        }

        /* --- BOTTOM SECTION: CONTROLS & KEYBOARD --- */
        .keyboard-section {
            background-color: var(--panel-bg);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding-top: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        .octave-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px 20px;
        }

        .arrow-btn {
            background: transparent;
            border: 1px solid #2c314a;
            color: var(--text-main);
            width: 50px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arrow-btn:active {
            background: #2c314a;
        }

        .current-octave {
            text-align: center;
        }

        .octave-val {
            font-size: 1.8rem;
            font-weight: bold;
            display: block;
            line-height: 1;
        }

        .octave-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* PIANO CSS TRICK */
        .piano-wrapper {
            position: relative;
            display: flex;
            width: 100%;
            height: 160px;
        }

        .white-key {
            flex: 1;
            background: var(--key-white);
            border: 1px solid #111;
            border-top: none;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            box-shadow: inset 0 -4px 8px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .white-key:active, .white-key.active {
            background: #cdd0da;
        }

        .black-key {
            position: absolute;
            width: 9%; /* Proporção para caber entre as teclas brancas */
            height: 60%;
            background: var(--key-black);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            box-shadow: inset 0 -5px 5px rgba(255,255,255,0.1), 3px 3px 6px rgba(0,0,0,0.4);
            z-index: 2;
            top: 0;
            border: 1px solid #000;
        }

        .black-key:active, .black-key.active {
            background: #222;
        }

        /* Posições exatas das teclas pretas para uma oitava inteira (C a B) */
        /* 7 teclas brancas = ~14.28% cada. Centrar a tecla preta requer matemática. */
        .bk-1 { left: 9.78%; }  /* C# */
        .bk-2 { left: 24.07%; } /* D# */
        .bk-3 { left: 52.64%; } /* F# */
        .bk-4 { left: 66.92%; } /* G# */
        .bk-5 { left: 81.21%; } /* A# */

    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="display-section">
            <div class="note-wrapper">
                <span class="main-note">C#<span class="octave-number" id="displayOctave">2</span></span>
            </div>
            <h2 class="note-name">Dó Sustenido</h2>
            
            <div class="info-grid">
                <div class="info-block">
                    <span class="info-label">Frequência</span>
                    <span class="info-value">Segunda Oitava</span>
                </div>
                <div class="divider"></div>
                <div class="info-block">
                    <span class="info-label">Frequência</span>
                    <span class="info-value">69.3 Hz</span>
                </div>
            </div>
        </div>

        <div class="mic-section">
            <button class="mic-button" id="micBtn">
                <span>Iniciar detecção</span>
                <span>de tom</span>
            </button>
        </div>

        <div class="keyboard-section">
            <div class="octave-controls">
                <button class="arrow-btn" id="prevBtn">&#8592;</button>
                <div class="current-octave">
                    <span class="octave-val" id="controlOctave">2</span>
                    <span class="octave-label">Oitava</span>
                </div>
                <button class="arrow-btn" id="nextBtn">&#8594;</button>
            </div>

            <div class="piano-wrapper">
                <div class="white-key"></div>
                <div class="white-key"></div>
                <div class="white-key"></div>
                <div class="white-key"></div>
                <div class="white-key"></div>
                <div class="white-key"></div>
                <div class="white-key"></div>

                <div class="black-key bk-1 active"></div> 
                <div class="black-key bk-2"></div>
                <div class="black-key bk-3"></div>
                <div class="black-key bk-4"></div>
                <div class="black-key bk-5"></div>
            </div>
        </div>

    </div>

    <script>
        // Lógica de Oitavas
        let currentOctave = 2;
        const minOctave = 2;
        const maxOctave = 5;

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const controlOctaveDisplay = document.getElementById('controlOctave');
        const displayOctaveDisplay = document.getElementById('displayOctave');

        function updateOctave() {
            controlOctaveDisplay.innerText = currentOctave;
            displayOctaveDisplay.innerText = currentOctave;
        }

        prevBtn.addEventListener('click', () => {
            if (currentOctave > minOctave) {
                currentOctave--;
                updateOctave();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentOctave < maxOctave) {
                currentOctave++;
                updateOctave();
            }
        });

        // Lógica visual do Botão de Microfone
        const micBtn = document.getElementById('micBtn');
        let isListening = false;

        micBtn.addEventListener('click', () => {
            isListening = !isListening;
            if (isListening) {
                micBtn.classList.add('listening');
                micBtn.innerHTML = `<span>Ouvindo...</span><span style="font-size: 0.8rem; margin-top: 5px;">Aguardando nota</span>`;
            } else {
                micBtn.classList.remove('listening');
                micBtn.innerHTML = `<span>Iniciar detecção</span><span>de tom</span>`;
            }
        });
    </script>
</body>
</html>
